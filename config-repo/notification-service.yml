server:
  port: ${SERVER_PORT:8085}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/notification_db}
  kafka:
    consumer:
      group-id: notification
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapping JsonDeserializer lets deserialization failures (poison pills) surface to the error
      # handler as a DeserializationException instead of killing the consumer's poll loop outright.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.notification.event
        # order-service does not (and should not) know this class name; match on the topic instead.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.notification.event.OrderPlacedEvent
        isolation.level: read_committed
    # Only used to publish records the listener gives up on to the *.DLT topic (DeadLetterPublishingRecoverer).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topics:
      order-placed: order-placed
    dlq-monitor:
      interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always
