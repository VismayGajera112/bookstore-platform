# Shared defaults applied to every microservice (merged under application.yml on the Config Server).
# Per-service files override these. Secrets stay as ${ENV_VAR} placeholders — never plain passwords.

bookstore:
  jwt:
    # user-service signs; every other service verifies with the same secret + issuer.
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:1h}
    issuer: bookstore-platform
  # Refreshable demo property: edit this file, POST /actuator/refresh, watch /api/config/demo change.
  demo:
    message: "config loaded from config-server (v1)"

spring:
  kafka:
    # Shared by every producer and consumer; per-service files add the (de)serializer and
    # consumer-group settings that only make sense on one side of the wire.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

management:
  endpoints:
    web:
      exposure:
        # health/info for probes; prometheus for scraping; metrics/refresh/env stay ADMIN-gated in SecurityConfig.
        include: health,info,metrics,prometheus,refresh,env
  endpoint:
    health:
      show-details: when-authorized
      # Exposes /actuator/health/liveness and /readiness for Docker/K8s probes.
      probes:
        enabled: true
    refresh:
      # Lets an ADMIN re-pull central config without restarting the process.
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  level:
    com.example: INFO
    org.springframework.cloud.config: INFO
