server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    # native = read a local folder of YAML files. Switch to the default (git) profile in real
    # environments by pointing spring.cloud.config.server.git.uri at a Git repository.
    active: native
  cloud:
    config:
      server:
        native:
          # Local jar runs: ./config-repo from the platform root.
          # Containers: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config-repo
          search-locations: ${SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS:file:./config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:config-server}

logging:
  level:
    org.springframework.cloud.config: INFO
