server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/book_db}
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 25

# book-service only verifies JWTs; expiration is unused and omitted on purpose.
bookstore:
  jwt:
    secret: ${JWT_SECRET}
    issuer: bookstore-platform
  aws:
    enabled: true
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
    s3:
      cover-bucket: ${COVER_BUCKET:bookstore-covers}
      upload-url-expiry-seconds: ${COVER_UPLOAD_URL_EXPIRY_SECONDS:900}
    dynamodb:
      cover-metadata-table: ${COVER_METADATA_TABLE:CoverMetadata}
      browsing-history-table: ${BROWSING_HISTORY_TABLE:UserBrowsingHistory}
      browsing-history-ttl-days: ${BROWSING_HISTORY_TTL_DAYS:30}
