server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/book_db}
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 25

# book-service only verifies JWTs; expiration is unused and omitted on purpose.
bookstore:
  jwt:
    secret: ${JWT_SECRET}
    issuer: bookstore-platform
