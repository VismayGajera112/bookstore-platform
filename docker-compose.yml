# Full local stack: six Postgres DBs, Kafka, LocalStack, config-server, all microservices, gateway.
# Usage (from bookstore-platform/):
#   docker compose up -d --build
# Front door: http://localhost:8080
#
# Host-side jar runs (scripts/run-all.sh) still work against infra-only via published ports;
# app containers use Docker DNS names and the Kafka internal listener (kafka:29092).

x-app-env: &app-env
  CONFIG_SERVER_URL: http://config-server:8888
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-is-a-dev-only-secret-key-32b}
  JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  user-db:
    image: postgres:15-alpine
    container_name: bookstore-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - user-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  book-db:
    image: postgres:15-alpine
    container_name: bookstore-book-db
    environment:
      POSTGRES_DB: book_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - book-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-db:
    image: postgres:15-alpine
    container_name: bookstore-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - order-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-db:
    image: postgres:15-alpine
    container_name: bookstore-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - payment-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-db:
    image: postgres:15-alpine
    container_name: bookstore-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - notification-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  analytics-db:
    image: postgres:15-alpine
    container_name: bookstore-analytics-db
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
    volumes:
      - analytics-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Host clients use localhost:9092; containers on this network use kafka:29092.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bookstore-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bookstore-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  localstack:
    image: localstack/localstack:3.4
    container_name: bookstore-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,dynamodb,sns,sqs,lambda,iam
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Application services ---

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: bookstore/config-server:1.0.0
    container_name: bookstore-config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: bookstore/user-service:1.0.0
    container_name: bookstore-user-service
    depends_on:
      config-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      ADMIN_BOOTSTRAP_ENABLED: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bookstore.local}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  book-service:
    build:
      context: .
      dockerfile: book-service/Dockerfile
    image: bookstore/book-service:1.0.0
    container_name: bookstore-book-service
    depends_on:
      config-server:
        condition: service_healthy
      book-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://book-db:5432/book_db
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      COVER_BUCKET: bookstore-covers
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: bookstore/order-service:1.0.0
    container_name: bookstore-order-service
    depends_on:
      config-server:
        condition: service_healthy
      order-db:
        condition: service_healthy
      book-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      BOOK_SERVICE_URL: http://book-service:8082
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    image: bookstore/payment-service:1.0.0
    container_name: bookstore-payment-service
    depends_on:
      config-server:
        condition: service_healthy
      payment-db:
        condition: service_healthy
      order-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      ORDER_SERVICE_URL: http://order-service:8083
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    image: bookstore/notification-service:1.0.0
    container_name: bookstore-notification-service
    depends_on:
      config-server:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://notification-db:5432/notification_db
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    image: bookstore/analytics-service:1.0.0
    container_name: bookstore-analytics-service
    depends_on:
      config-server:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://analytics-db:5432/analytics_db
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: bookstore/api-gateway:1.0.0
    container_name: bookstore-api-gateway
    depends_on:
      config-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      book-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    environment:
      <<: *app-env
      USER_SERVICE_URL: http://user-service:8081
      BOOK_SERVICE_URL: http://book-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # --- Monitoring (Micrometer → Prometheus → Grafana) ---

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: bookstore-prometheus
    profiles: ["monitoring"]
    depends_on:
      - api-gateway
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.0.0
    container_name: bookstore-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  user-pgdata:
  book-pgdata:
  order-pgdata:
  payment-pgdata:
  notification-pgdata:
  analytics-pgdata:
  kafka-data:
  localstack-data:
  prometheus-data:
  grafana-data:
