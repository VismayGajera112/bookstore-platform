# Optional scrape annotations for Prometheus Operator / kubernetes prometheus.
# Example patch for user-service Service — apply pattern to other services as needed.
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: bookstore
  labels:
    app: user-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8081"
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: http
