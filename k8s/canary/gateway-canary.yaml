# Challenge example: canary Deployment for api-gateway (10% traffic via weight).
# Default cluster uses rolling updates (see gateway-deployment.yaml).
# Apply only when experimenting with canary:
#   kubectl apply -f k8s/canary/gateway-canary.yaml
#
# Traffic split is simulated with two Services + an Ingress/gateway weight annotation.
# On EKS with AWS Load Balancer Controller, use target-group weights; with Istio/Linkerd,
# use VirtualService / TrafficSplit. Rollback = delete canary + scale stable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-canary
  namespace: bookstore
  labels:
    app: api-gateway
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
      track: canary
  template:
    metadata:
      labels:
        app: api-gateway
        track: canary
    spec:
      containers:
        - name: api-gateway
          # Pin the candidate SHA from CI: ghcr.io/.../api-gateway:<candidate-sha>
          image: bookstore/api-gateway:canary
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: bookstore-config
            - secretRef:
                name: bookstore-secrets
          env:
            - name: USER_SERVICE_URL
              value: http://user-service:8081
            - name: BOOK_SERVICE_URL
              value: http://book-service:8082
            - name: ORDER_SERVICE_URL
              value: http://order-service:8083
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8084
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-canary
  namespace: bookstore
  labels:
    app: api-gateway
    track: canary
spec:
  selector:
    app: api-gateway
    track: canary
  ports:
    - name: http
      port: 8080
      targetPort: http
