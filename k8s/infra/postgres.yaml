# Minimal Postgres Deployments for local minikube/kind demos (emptyDir — data is ephemeral).
# Prefer a managed DB (RDS) or a proper StatefulSet + PVC operator in real environments.
apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: user-db
      namespace: bookstore
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: user-db
      template:
        metadata:
          labels:
            app: user-db
        spec:
          containers:
            - name: postgres
              image: postgres:15-alpine
              ports:
                - containerPort: 5432
              env:
                - name: POSTGRES_DB
                  value: user_db
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: bookstore-secrets
                      key: DB_USERNAME
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: bookstore-secrets
                      key: DB_PASSWORD
              readinessProbe:
                tcpSocket:
                  port: 5432
                initialDelaySeconds: 10
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 12
              livenessProbe:
                tcpSocket:
                  port: 5432
                initialDelaySeconds: 30
                periodSeconds: 20
                timeoutSeconds: 3
                failureThreshold: 3
  - apiVersion: v1
    kind: Service
    metadata:
      name: user-db
      namespace: bookstore
    spec:
      selector:
        app: user-db
      ports:
        - port: 5432
          targetPort: 5432
