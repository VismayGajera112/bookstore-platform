apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bookstore
  labels:
    app: api-gateway
spec:
  # NodePort for minikube/kind; switch to LoadBalancer on cloud (EKS + NLB/ALB).
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
