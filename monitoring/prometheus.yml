# Prometheus scrapes each bookstore service's /actuator/prometheus endpoint.
# Run with: docker compose up -d prometheus grafana
# (or include via the main compose file's monitoring profile).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: api-gateway

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8081"]
        labels:
          service: user-service

  - job_name: book-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["book-service:8082"]
        labels:
          service: book-service

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8083"]
        labels:
          service: order-service

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8084"]
        labels:
          service: payment-service

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8085"]
        labels:
          service: notification-service

  - job_name: analytics-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["analytics-service:8086"]
        labels:
          service: analytics-service

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-server:8888"]
        labels:
          service: config-server
