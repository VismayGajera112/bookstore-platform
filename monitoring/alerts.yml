groups:
  - name: bookstore-slo
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (service) (rate(http_server_requests_seconds_count[5m]))
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx rate on {{ $labels.service }}"
          description: "Error rate > 5% for 5 minutes. Route to SNS/Slack on-call."

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum by (service, le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p99 latency > 2s on {{ $labels.service }}"

      - alert: ServiceDown
        expr: up{job=~".*-service|api-gateway|config-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} scrape target is down"

      - alert: HikariPoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP has pending waiters on {{ $labels.application }}"

      - alert: KafkaDltDepthHigh
        expr: kafka_dlt_depth > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DLT depth high on {{ $labels.application }} (notification/analytics)"
